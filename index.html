<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <meta name="description" content="Find FRC parts in the shop: how many we have and where they are.">
  <title>Shop Inventory</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <main id="main" tabindex="-1">
    <!-- Library -->
    <section class="view" id="view-library" aria-labelledby="lib-title">
      <header class="top">
        <div>
          <h1 id="lib-title">Inventory</h1>
          <p class="sub" id="lib-sub"></p>
        </div>
        <button class="icon-btn" id="menu-btn" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </header>

      <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr">Search parts</span>
          <input id="q" type="search" placeholder="Search parts, bins, sizes…" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button class="clear" id="q-clear" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </label>
      </div>

      <div class="chips-row">
        <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
        <button class="filter-btn" id="filter-btn" type="button" aria-label="Filter by subcategory" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span class="fb-label">Filter</span><b class="fb-n num"></b>
        </button>
      </div>
      <div class="sub-row" id="sub-row" hidden></div>
      <div class="area-filter" id="area-filter" hidden></div>

      <div id="low-strip-wrap"></div>

      <div class="list-head">
        <h2 id="list-title">All parts</h2>
        <span class="count" id="list-count" aria-live="polite"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <p class="empty-t">Nothing matches that.</p>
        <p class="empty-s">Try a size like “1/4”, a bin color, or a spot like “door”.</p>
        <button class="btn ghost" type="button" id="empty-add">Add it as a new part</button>
      </div>
    </section>

    <!-- Places -->
    <section class="view" id="view-places" aria-labelledby="places-title" hidden>
      <header class="top">
        <div>
          <h1 id="places-title">Places</h1>
          <p class="sub">Where things live in the shop</p>
        </div>
      </header>
      <div class="places" id="places"></div>
    </section>

    <!-- Low stock -->
    <section class="view" id="view-low" aria-labelledby="low-title" hidden>
      <header class="top">
        <div>
          <h1 id="low-title">Running low</h1>
          <p class="sub" id="low-sub"></p>
        </div>
      </header>
      <div class="rows" id="low-list"></div>
    </section>
  </main>

  <!-- Bottom nav -->
  <nav class="dock" aria-label="Main">
    <a href="#/" data-tab="library" aria-label="Library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span>Library</span>
    </a>
    <a href="#/places" data-tab="places" aria-label="Places">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Places</span>
    </a>
    <a href="#/low" data-tab="low" aria-label="Running low">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h5"/></svg>
      <span>Low</span>
      <b class="badge" id="low-badge" hidden></b>
    </a>
    <a href="#/add" class="add" aria-label="Add a part">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

  <!-- Part detail -->
  <dialog class="sheet" id="detail" aria-labelledby="d-name"></dialog>
  <!-- Add / edit -->
  <dialog class="sheet form-sheet" id="editor" aria-labelledby="e-title"></dialog>
  <!-- Photo viewer -->
  <dialog class="viewer" id="viewer" aria-label="Photo"></dialog>
  <!-- Subcategory filter -->
  <dialog class="sheet small" id="filter" aria-labelledby="f-title"></dialog>
  <!-- Settings -->
  <dialog class="sheet small" id="menu" aria-labelledby="m-title"></dialog>

  <dialog class="sheet small" id="photo-ed" aria-labelledby="pe-title"></dialog>

  <dialog class="sheet picker" id="picker" aria-labelledby="pk-title"></dialog>

  <dialog class="sheet cropper" id="cropper" aria-labelledby="cr-title"></dialog>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
